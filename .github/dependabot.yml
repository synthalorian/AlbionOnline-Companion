version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    day: monday
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    github-actions-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
- package-ecosystem: nuget
  directories:
  - /StatisticAnalysisTool.Extractor
  - /StatisticsAnalysisTool
  - /StatisticsAnalysisTool.Abstractions
  - /StatisticsAnalysisTool.Diagnostics
  - /StatisticsAnalysisTool.Network
  - /StatisticsAnalysisTool.PhotonPackageParser
  - /StatisticsAnalysisTool.Protocol18
  schedule:
    day: monday
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    nuget-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
  commit-message:
    prefix: chore(deps)
